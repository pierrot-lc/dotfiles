[metadata]
name = "papis"
description = "Select papis papers"
requirements = ["papis"]

[source]
command = "papis list --all --format '{doc[papis_id]}\t{doc[title]}\t{doc[author]}\t{doc[year]}\t{doc[tags]}'"
display = "{split:\t:4|substring:1..-1|split:, :..|map:{substring:1..-1}|join: |prepend:[|append:]|pad:10} {split:\t:1|substring:0..100|pad:100: :right}        {split:\t:2|split: :0|replace:s/,//g|pad:20: :right} {split:\t:3}"
output = "{split:\t:0}"

[preview]
# Papis's formatting is specified with '{doc[]}' formatting, which clashes with
# Television's own templating format. Only '${}' are considered as shell
# variable expansions by Television.
command = "echo '{split:\t:1}\n\n{split:\t:2}\n\n' $(papis list --format '${doc[abstract]}' {split:\t:0} | cut -c 2-)"

[ui.preview_panel]
word_wrap = true
size = 20

[actions.view]
description = "Open selected papers"
command = "echo '{split:\n:..|map:{split:\t:0}|join: }' | xargs -n 1 papis open"
separator = "\n"

[keybindings]
enter = "actions:view"
